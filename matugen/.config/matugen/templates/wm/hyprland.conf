# Generated by matugen (Hyprland colors)
# Source this in your hyprland config: source = ~/.config/hypr/matugen/colors.conf

# Wallpaper path
$wallpaper = {{ image }}

# Border colors (Material You palette)
$border_active   = rgba({{ colors.primary.default.hex_stripped }}ee)
$border_inactive = rgba({{ colors.surface_container.default.hex_stripped }}aa)

# Glass accent colors
$accent          = rgba({{ colors.primary.default.hex_stripped }}ff)
$accent_dim      = rgba({{ colors.primary.default.hex_stripped }}99)
$surface         = rgba({{ colors.surface.default.hex_stripped }}ff)
$surface_dim     = rgba({{ colors.surface_dim.default.hex_stripped }}ff)
$background      = rgba({{ colors.background.default.hex_stripped }}ff)

# All Material You colors (for custom use)
<* for name, value in colors *>
${{ name }} = rgba({{ value.default.hex_stripped }}ff)
<* endfor *>
