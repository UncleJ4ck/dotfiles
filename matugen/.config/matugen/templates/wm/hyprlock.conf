# Generated by matugen (Hyprlock vars)

# Image Path
$wall = {{ image }}

# Aliases expected by your hyprlock.conf
$bg          = rgba({{ colors.background.default.hex_stripped }}ff)
$dim         = rgba({{ colors.background.default.hex_stripped }}99)
$surface_70  = rgba({{ colors.surface.default.hex_stripped }}b3)
$outline_70  = rgba({{ colors.outline.default.hex_stripped }}b3)

# Optional alpha helper
$surface_alpha = rgba({{ colors.surface.default.hex_stripped }}4d)

# All colors (nice for debugging / future use)
<* for name, value in colors *>
${{ name }} = rgba({{ value.default.hex_stripped }}ff)
<* endfor *>
