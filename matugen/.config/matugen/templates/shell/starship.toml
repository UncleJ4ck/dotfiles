"$schema" = "https://starship.rs/config-schema.json"

palette = "matugen"
add_newline = true

# Left prompt
format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$lua\
$docker_context\
$kubernetes\
$cmd_duration\
$jobs\
$status\
$fill\
$line_break\
$character"""

# Right prompt
right_format = """\
$time\
$battery"""

# --------------------------------------------------------------------
# Matugen-driven palette
# --------------------------------------------------------------------
[palettes.matugen]
bg        = "{{ colors.surface.default.hex }}"
fg        = "{{ colors.on_surface.default.hex }}"
muted     = "{{ colors.on_surface_variant.default.hex }}"
primary   = "{{ colors.primary.default.hex }}"
secondary = "{{ colors.secondary.default.hex }}"
tertiary  = "{{ colors.tertiary.default.hex }}"
error     = "{{ colors.error.default.hex }}"

warning   = "{{ colors.warning.default.hex }}"
info      = "{{ colors.info.default.hex }}"
success   = "{{ colors.success.default.hex }}"

# Light-ish bubble backgrounds (Matugen will keep them coherent)
id_bg        = "{{ colors.surface_container.default.hex }}"
dir_bg       = "{{ colors.surface_container_high.default.hex }}"
git_bg       = "{{ colors.surface_container.default.hex }}"
git_status_bg= "{{ colors.surface_container_high.default.hex }}"
lang_bg      = "{{ colors.surface_container_high.default.hex }}"
cloud_bg     = "{{ colors.surface_container.default.hex }}"
runtime_bg   = "{{ colors.surface_container.default.hex }}"
time_bg      = "{{ colors.surface_container_high.default.hex }}"
battery_bg   = "{{ colors.surface_container_high.default.hex }}"

# Bubble text colors
id_fg   = "{{ colors.on_surface.default.hex }}"
dir_fg  = "{{ colors.on_surface.default.hex }}"
git_fg  = "{{ colors.on_surface.default.hex }}"
lang_fg = "{{ colors.on_surface.default.hex }}"

# Accents inside bubbles
dir_icon     = "{{ colors.primary.default.hex }}"
dir_repo_fg  = "{{ colors.primary.default.hex }}"
git_icon     = "{{ colors.secondary.default.hex }}"

# Status / character bubbles
status_bg    = "{{ colors.error_container.default.hex }}"
status_fg    = "{{ colors.on_error_container.default.hex }}"
char_bg      = "{{ colors.primary.default.hex }}"
char_fg      = "{{ colors.on_primary.default.hex }}"
char_err_bg  = "{{ colors.error_container.default.hex }}"
char_err_fg  = "{{ colors.on_error_container.default.hex }}"
char_vim_bg  = "{{ colors.tertiary.default.hex }}"
char_vim_fg  = "{{ colors.on_tertiary.default.hex }}"


# --------------------------------------------------------------------
# Identity bubbles
# --------------------------------------------------------------------
[username]
show_always = false
style_user = "bold fg:primary bg:id_bg"
style_root = "bold fg:error bg:id_bg"
format = "[](fg:id_bg)[ $user ]($style)[](fg:id_bg) "

[hostname]
ssh_only = true
style = "fg:muted bg:id_bg"
format = "[](fg:id_bg)[ @$hostname ]($style)[](fg:id_bg) "


# --------------------------------------------------------------------
# Directory bubble (always, including in git repos)
# --------------------------------------------------------------------
[directory]
home_symbol = "~"
truncation_length = 0
truncate_to_repo = false

read_only = " 󰌾"
read_only_style = "bold fg:error bg:dir_bg"

style = "bold fg:dir_fg bg:dir_bg"
format = "[](fg:dir_bg)[ 󰉋 ](bold fg:dir_icon bg:dir_bg)[ $path ]($style)[$read_only]($read_only_style)[](fg:dir_bg) "

# --------------------------------------------------------------------
# Git bubbles
# --------------------------------------------------------------------
[git_branch]
symbol = " "
style = "bold fg:git_fg bg:git_bg"
format = "[](fg:git_bg)[ $symbol$branch ]($style)[](fg:git_bg) "
truncation_length = 24

[git_state]
style = "fg:muted bg:git_bg"
format = "([](fg:git_bg)[ $state( $progress_current/$progress_total) ]($style)[](fg:git_bg) )"

[git_status]
style = "fg:muted bg:git_status_bg"
format = "([](fg:git_status_bg)[ $all_status$ahead_behind ]($style)[](fg:git_status_bg) )"

conflicted = "󰞇 ${count} "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "󰞋 ${count} "
stashed    = "󰏗 ${count} "
modified   = "󰏫 ${count} "
staged     = "󰐗 ${count} "
renamed    = "󰑕 ${count} "
deleted    = "󰍶 ${count} "


# --------------------------------------------------------------------
# Language bubbles
# --------------------------------------------------------------------
[python]
symbol = " "
style = "bold fg:info bg:lang_bg"
format = '[](fg:lang_bg)[ $symbol($version)(\($virtualenv\)) ]($style)[](fg:lang_bg) '

[rust]
symbol = " "
style = "bold fg:warning bg:lang_bg"
format = "[](fg:lang_bg)[ $symbol($version) ]($style)[](fg:lang_bg) "

[golang]
symbol = " "
style = "bold fg:success bg:lang_bg"
format = "[](fg:lang_bg)[ $symbol($version) ]($style)[](fg:lang_bg) "

[nodejs]
symbol = " "
style = "bold fg:tertiary bg:lang_bg"
format = "[](fg:lang_bg)[ $symbol($version) ]($style)[](fg:lang_bg) "

[lua]
symbol = " "
style = "bold fg:secondary bg:lang_bg"
format = "[](fg:lang_bg)[ $symbol($version) ]($style)[](fg:lang_bg) "


# --------------------------------------------------------------------
# Containers / Orchestration bubbles
# --------------------------------------------------------------------
[docker_context]
symbol = " "
only_with_files = true
style = "bold fg:primary bg:cloud_bg"
format = "[](fg:cloud_bg)[ $symbol$context ]($style)[](fg:cloud_bg) "

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold fg:secondary bg:cloud_bg"
format = '[](fg:cloud_bg)[ $symbol$context(\($namespace\)) ]($style)[](fg:cloud_bg) '


# --------------------------------------------------------------------
# Runtime bubbles
# --------------------------------------------------------------------
[cmd_duration]
min_time = 2000
style = "bold fg:warning bg:runtime_bg"
format = "[](fg:runtime_bg)[ 󰔟 $duration ]($style)[](fg:runtime_bg) "

[jobs]
symbol = "󰜎 "
number_threshold = 1
style = "fg:muted bg:runtime_bg"
format = "[](fg:runtime_bg)[ $symbol$number ]($style)[](fg:runtime_bg) "

[status]
disabled = false
symbol = "󰅚 "
style = "bold fg:status_fg bg:status_bg"
format = "[](fg:status_bg)[ $symbol$status ]($style)[](fg:status_bg) "


# Push right prompt
[fill]
symbol = " "
style = "none"

# --------------------------------------------------------------------
# Prompt character (also bubbled)
# --------------------------------------------------------------------
[character]
success_symbol = "[╰─](muted)[](fg:char_bg)[ ❯ ](bold fg:char_fg bg:char_bg)[](fg:char_bg) "
error_symbol   = "[╰─](muted)[](fg:char_err_bg)[ ❯ ](bold fg:char_err_fg bg:char_err_bg)[](fg:char_err_bg) "
vimcmd_symbol  = "[╰─](muted)[](fg:char_vim_bg)[ ❮ ](bold fg:char_vim_fg bg:char_vim_bg)[](fg:char_vim_bg) "


[package]
disabled = true
