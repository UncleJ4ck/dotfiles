"$schema" = "https://starship.rs/config-schema.json"

palette = "matugen"
add_newline = true

# Left prompt
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$lua\
$docker_context\
$kubernetes\
$cmd_duration\
$jobs\
$status\
$fill\
$line_break\
$character"""

# Right prompt
right_format = """
$time\
$battery"""

# Matugen-driven palette
[palettes.matugen]
bg        = "{{ colors.surface.default.hex }}"
fg        = "{{ colors.on_surface.default.hex }}"
muted     = "{{ colors.on_surface_variant.default.hex }}"
primary   = "{{ colors.primary.default.hex }}"
secondary = "{{ colors.secondary.default.hex }}"
tertiary  = "{{ colors.tertiary.default.hex }}"
error     = "{{ colors.error.default.hex }}"

# Your custom colors defined in matugen config.toml as:
# [config.custom_colors.warning] / info / success
# Available in templates as: colors.warning.default.hex (etc.) :contentReference[oaicite:5]{index=5}
warning   = "{{ colors.warning.default.hex }}"
info      = "{{ colors.info.default.hex }}"
success   = "{{ colors.success.default.hex }}"

# ---------------------------
# Identity / Path
# ---------------------------

[username]
show_always = false
format = "[$user]($style)"
style_user = "bold primary"
style_root = "bold error"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "muted"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold fg"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "error"
home_symbol = "~"

# ---------------------------
# Git
# ---------------------------

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold secondary"
truncation_length = 24

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "muted"

[git_status]
# This is what was showing as: ✘1!7?50 in your old config.
# Now: clean Nerd Font icons + spacing.
format = "([$all_status$ahead_behind]($style) )"
style = "muted"
conflicted = "󰞇 ${count} "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "󰞋 ${count} "
stashed    = "󰏗 ${count} "
modified   = "󰏫 ${count} "
staged     = "󰐗 ${count} "
renamed    = "󰑕 ${count} "
deleted    = "󰍶 ${count} "

# ---------------------------
# Languages (your modules + icons)
# ---------------------------

[python]
symbol = " "
format = '[$symbol($version)(\($virtualenv\))]($style) '
style = "info"

[rust]
symbol = " "
format = "[$symbol($version)]($style) "
style = "warning"

[golang]
symbol = " "
format = "[$symbol($version)]($style) "
style = "success"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style = "tertiary"

[lua]
symbol = " "
format = "[$symbol($version)]($style) "
style = "secondary"

# ---------------------------
# Containers / Orchestration
# ---------------------------

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "primary"
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾 "
format = '[$symbol$context(\($namespace\))]($style) '
style = "secondary"

# ---------------------------
# Runtime info
# ---------------------------

[cmd_duration]
min_time = 2000
format = "[󰔟 $duration]($style) "
style = "warning"

[jobs]
symbol = "󰜎 "
number_threshold = 1
format = "[$symbol$number]($style) "
style = "muted"

[status]
disabled = false
symbol = "󰅚 "
format = "[$symbol$status]($style) "
style = "error"

# Push right prompt
[fill]
symbol = " "
style = "none"

# Prompt char
[character]
success_symbol = "[❯](primary)"
error_symbol   = "[❯](error)"
vimcmd_symbol  = "[❮](info)"

[package]
disabled = true
