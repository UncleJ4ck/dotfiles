[config]

[templates.kitty]
  input_path  = './templates/shell/kitty.conf'
  output_path = '~/.config/kitty/colors.conf'

[templates.gtk3]
  input_path  = "~/.config/matugen/templates/ui/gtk/gtk-colors.css"
  output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
  input_path  = "~/.config/matugen/templates/ui/gtk/gtk-colors.css"
  output_path = "~/.config/gtk-4.0/colors.css"

[templates.qt5ct]
  input_path  = "~/.config/matugen/templates/ui/qt/qtct.conf"
  output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
  input_path  = "~/.config/matugen/templates/ui/qt/qtct.conf"
  output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.kvantum]
  input_path  = "~/.config/matugen/templates/ui/kvantum/MateriaDark-Matugen.kvconfig"
  output_path = "~/.config/Kvantum/MateriaDark-Matugen/MateriaDark-Matugen.kvconfig"

[templates.starship]
  input_path  = "./templates/shell/starship.toml"
  output_path = "~/.config/starship/starship.toml"

[config.custom_colors.warning]
  color = "#f9e2af"
  blend = true

[config.custom_colors.info]
  color = "#89b4fa"
  blend = true

[config.custom_colors.success]
  color = "#a6e3a1"
  blend = true



[templates.hyprlock]
  input_path  = "~/.config/matugen/templates/wm/hyprlock.conf"
  output_path = "~/.config/hypr/hyprlock/matugen/matugen-hyprlock.conf"
