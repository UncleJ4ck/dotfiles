[config]

# Firefox theming is left entirely to pywalfox (native host + addon). matugen no
# longer generates userContent.css or the start-page style.css. Removed 2026-06-20.

[templates.nvim]
  input_path  = "~/.config/matugen/templates/shell/matugen.lua"
  output_path = "~/.config/nvim/colors/matugen.lua"

[templates.zsh-colors]
  input_path  = "~/.config/matugen/templates/shell/zsh-colors.zsh"
  output_path = "~/.config/zsh/rc.d/05-colors.zsh"

[templates.kitty]
  input_path  = '~/.config/matugen/templates/shell/kitty.conf'
  output_path = '~/.config/kitty/colors.conf'

[templates.bat]
  input_path = '~/.config/matugen/templates/shell/matugen-bat-colors.tmTheme'
  output_path = '~/.config/bat/themes/Matugen.tmTheme'
  post_hook = 'command bat cache --build >/dev/null 2>&1 || bat cache --build'

[templates.gtk3]
  input_path  = "/home/j4kuuu/.config/matugen/templates/ui/gtk/gtk3-full.css"
  output_path = "/home/j4kuuu/.config/gtk-3.0/gtk.css"

[templates.gtk4]
  input_path  = "/home/j4kuuu/.config/matugen/templates/ui/gtk/gtk4-libadwaita-full.css"
  output_path = "/home/j4kuuu/.config/gtk-4.0/gtk.css"

[templates.hyprtoolkit]
  input_path  = "~/.config/matugen/templates/ui/hyprtoolkit.conf"
  output_path = "~/.config/hypr/hyprtoolkit.conf"

[templates.qt5ct]
  input_path  = "~/.config/matugen/templates/ui/qt/qtct.conf"
  output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
  input_path  = "~/.config/matugen/templates/ui/qt/qtct.conf"
  output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.kvantum]
  input_path = '~/.config/matugen/templates/ui/kvantum/kvantum.kvconfig'
  output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum-svg]
  input_path = '~/.config/matugen/templates/ui/kvantum/kvantum.svg'
  output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.starship]
  input_path  = "~/.config/matugen/templates/shell/starship.toml"
  output_path = "~/.config/starship/starship.toml"

[templates.hyprlock]
  input_path  = "~/.config/matugen/templates/wm/hyprlock.conf"
  output_path = "~/.config/hypr/hyprlock/matugen/matugen-hyprlock.conf"

[templates.hyprland]
  input_path  = "~/.config/matugen/templates/wm/hyprland.conf"
  output_path = "~/.config/hypr/matugen/colors.conf"
  post_hook   = 'hyprctl reload'

[templates.waybar]
  input_path  = "~/.config/matugen/templates/ui/waybar/colors.css"
  output_path = "~/.config/waybar/colors/colors.css"
  post_hook   = 'sleep 0.3; pkill -SIGUSR2 -x waybar 2>/dev/null || true'

[templates.rofi]
  input_path  = "~/.config/matugen/templates/ui/rofi/colors.rasi"
  output_path = "~/.config/rofi/colors/colors.rasi"

[templates.rofi-radius]
  input_path  = "~/.config/matugen/templates/ui/rofi/radius.rasi"
  output_path = "~/.config/rofi/colors/radius.rasi"

[templates.swaync]
  input_path  = "~/.config/matugen/templates/ui/swaync/colors.css"
  output_path = "~/.config/swaync/colors.css"
  post_hook   = 'swaync-client -rs 2>/dev/null || true'

[templates.evercal]
  input_path  = "~/.config/matugen/templates/ui/evercal/colors.css"
  output_path = "~/.config/EverCal/colors.css"

[templates.pywal_colors]
  input_path  = "~/.config/matugen/templates/pywal/colors"
  output_path = "~/.cache/wal/colors.tmp"
  post_hook   = "mv -f ~/.cache/wal/colors.tmp ~/.cache/wal/colors"

[templates.pywal_colors_json]
  input_path  = "~/.config/matugen/templates/pywal/colors.full.json"
  output_path = "~/.cache/wal/colors.json.tmp"
  post_hook   = "mv -f ~/.cache/wal/colors.json.tmp ~/.cache/wal/colors.json && pywalfox update >/dev/null 2>&1 || true"

[templates.discord_midnight]
  input_path  = "~/.config/matugen/templates/apps/discord-midnight-matugen.theme.css"
  output_path = "~/.config/vesktop/themes/midnight-matugen.theme.css"


[config.custom_colors.warning]
  color = "#f9e2af"
  blend = true

[config.custom_colors.info]
  color = "#89b4fa"
  blend = true

[config.custom_colors.success]
  color = "#a6e3a1"
  blend = true
