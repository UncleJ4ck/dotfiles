# Hyprland Configuration
# Modular config structure - edit files in conf.d/ for specific settings
#
# Structure:
#   conf.d/
#     ├── env.conf           - Environment variables
#     ├── autostart.conf     - Exec-once applications
#     ├── input.conf         - Keyboard, mouse, touchpad
#     ├── decorations.conf   - Visual appearance, blur, shadows
#     ├── animations.conf    - Animation settings
#     ├── windowrules.conf   - Window rules
#     ├── workspacerules.conf- Workspace rules
#     ├── keybinds.conf      - All keybindings
#     └── misc.conf          - General/misc settings
#
#   animations/              - Animation presets (swap in animations.conf)
#     ├── minimal.conf
#     ├── smooth.conf
#     └── disabled.conf

# ══════════════════════════════════════════════════════════════
# Core Configuration Modules
# ══════════════════════════════════════════════════════════════

# Environment variables (Hyprland-specific, UWSM handles the rest)
source = ~/.config/hypr/conf.d/env.conf

# Autostart applications
source = ~/.config/hypr/conf.d/autostart.conf

# Input devices
source = ~/.config/hypr/conf.d/input.conf

# Visual appearance - glass style
source = ~/.config/hypr/conf.d/decorations.conf

# Animations (swap with animations/*.conf for different styles)
source = ~/.config/hypr/conf.d/animations.conf

# Window rules
source = ~/.config/hypr/conf.d/windowrules.conf

# Workspace rules
source = ~/.config/hypr/conf.d/workspacerules.conf

# Keybindings
source = ~/.config/hypr/conf.d/keybinds.conf

# Miscellaneous settings
source = ~/.config/hypr/conf.d/misc.conf


# ══════════════════════════════════════════════════════════════
# Matugen/Theme Colors (dynamic wallpaper-based colors)
# Must be sourced AFTER decorations.conf to override border colors
# ══════════════════════════════════════════════════════════════
source = /home/j4kuuu/.config/hypr/matugen/colors.conf


# ══════════════════════════════════════════════════════════════
# User Overrides (create this file for personal tweaks)
# ══════════════════════════════════════════════════════════════
