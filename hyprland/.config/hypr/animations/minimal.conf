# Minimal Animations
# Fast, subtle animations for performance

animations {
    enabled = true

    bezier = quick, 0.15, 0, 0.1, 1
    bezier = linear, 0, 0, 1, 1

    animation = global, 1, 2, quick
    animation = windows, 1, 2, quick, popin 80%
    animation = windowsOut, 1, 1, linear, popin 80%
    animation = fade, 1, 2, quick
    animation = workspaces, 1, 2, quick, slide
    animation = layers, 1, 2, quick
}
