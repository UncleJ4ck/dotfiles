# Smooth Animations
# macOS-inspired fluid animations

animations {
    enabled = true

    # macOS-style beziers
    bezier = macEase, 0.25, 1.0, 0.5, 1.0
    bezier = macPop, 0.2, 0.8, 0.4, 1.1
    bezier = macSmooth, 0.4, 0.0, 0.2, 1.0
    bezier = macBounce, 0.68, -0.55, 0.265, 1.55

    # Smooth window animations
    animation = global, 1, 8, macSmooth
    animation = border, 1, 6, macEase
    animation = windows, 1, 5, macPop, popin 90%
    animation = windowsIn, 1, 5, macPop, popin 90%
    animation = windowsOut, 1, 4, macSmooth, popin 90%
    animation = windowsMove, 1, 4, macSmooth

    # Fade
    animation = fade, 1, 4, macSmooth
    animation = fadeIn, 1, 3, macSmooth
    animation = fadeOut, 1, 3, macSmooth

    # Layers
    animation = layers, 1, 4, macSmooth
    animation = layersIn, 1, 4, macPop, fade
    animation = layersOut, 1, 3, macSmooth, fade

    # Workspaces
    animation = workspaces, 1, 5, macSmooth, slidefade 30%
    animation = specialWorkspace, 1, 5, macPop, slidefadevert -30%
}
