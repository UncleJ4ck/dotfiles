# -----------------------------------------------------------------------------
# Hyprlock (structured)
# - Matugen colors: ~/.config/hypr/hyprlock/matugen/matugen-hyprlock.conf
# - Scripts:        ~/.config/hypr/hyprlock/scripts/*.sh
# -----------------------------------------------------------------------------

source = $HOME/.config/hypr/hyprlock/matugen/matugen-hyprlock.conf
$scripts = $HOME/.config/hypr/hyprlock/scripts

$image = $wall
$font_ui   = JetBrainsMono Nerd Font
$font_mono = JetBrainsMono Nerd Font

general {
  hide_cursor = true
  ignore_empty_input = true
  fail_timeout = 1000
}

animations {
  enabled = true
  bezier = ease, 0.25, 0.10, 0.25, 1
  animation = fadeIn, 1, 2, ease
  animation = fadeOut, 1, 5, ease
  animation = inputFieldColors, 1, 5, ease
  animation = inputFieldDots, 1, 5, ease
  animation = inputFieldWidth, 1, 5, ease
}

background {
  monitor =
  path = $wall
  color = $bg
  blur_size = 6
  blur_passes = 2
  noise = 0.0100
  contrast = 1.10
  brightness = 0.55
  vibrancy = 0.22
  vibrancy_darkness = 0.15
}

# Dim overlay
shape {
  monitor =
  size = 100%, 100%
  color = $dim
  zindex = -1
}

# ============== TOP LEFT CORNER ==============
# Network
label {
  monitor =
  text = cmd[update:2000] $scripts/wifi_status.sh
  color = $on_surface
  font_size = 14
  font_family = $font_mono
  halign = left
  valign = top
  position = 20, -20
}

# Volume
label {
  monitor =
  text = cmd[update:1000] $scripts/volume_status.sh
  color = $on_surface_variant
  font_size = 14
  font_family = $font_mono
  halign = left
  valign = top
  position = 20, -45
}

# Brightness
label {
  monitor =
  text = cmd[update:1500] $scripts/brightness_status.sh
  color = $on_surface_variant
  font_size = 14
  font_family = $font_mono
  halign = left
  valign = top
  position = 20, -70
}

# ============== TOP RIGHT CORNER ==============
# Battery
label {
  monitor =
  text = cmd[update:2000] $scripts/battery_status.sh
  color = $on_surface
  font_size = 14
  font_family = $font_mono
  halign = right
  valign = top
  position = -20, -20
  zindex = 10
}

# Bluetooth
label {
  monitor =
  text = cmd[update:3000] $scripts/bluetooth_status.sh
  color = $on_surface_variant
  font_size = 14
  font_family = $font_mono
  halign = right
  valign = top
  position = -20, -45
}

# Keyboard layout
label {
  monitor =
  text = cmd[update:5000] $scripts/layout_status.sh
  color = $on_surface_variant
  font_size = 14
  font_family = $font_mono
  halign = right
  valign = top
  position = -20, -70
}

# Uptime
label {
  monitor =
  text = cmd[update:60000] $scripts/uptime_status.sh
  color = $on_surface_variant
  font_size = 14
  font_family = $font_mono
  halign = right
  valign = top
  position = -20, -95
  shadow_passes = 0
}

# ============== CENTER (top to bottom) ==============
# Time
label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  color = $primary
  font_size = 96
  font_family = $font_ui
  halign = center
  valign = center
  position = 0, 320
}

# Date
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B"
  color = $on_surface
  font_size = 28
  font_family = $font_ui
  halign = center
  valign = center
  position = 0, 220
}

# User profile image
image {
  monitor =
  path = $HOME/Pictures/Profile/user.jpeg
  size = 120
  rounding = -1
  border_size = 3
  border_color = $primary
  shadow_passes = 1
  shadow_size = 3
  shadow_color = $shadow
  halign = center
  valign = center
  position = 0, 0
}

# Input field (matugen themed)
input-field {
  monitor =
  size = 320, 56
  rounding = 18
  outline_thickness = 2

  hide_input = false
  dots_text_format = •
  dots_size = 0.20
  dots_spacing = 0.45
  dots_center = true

  inner_color = $surface_container
  outer_color = $primary
  font_color  = $on_surface
  check_color = $success
  fail_color  = $error
  capslock_color = $tertiary
  swap_font_color = true

  fail_text = <i>$FAIL</i> (<b>$ATTEMPTS</b>)
  placeholder_text = <i>Unlock</i>

  fade_on_empty = true
  halign = center
  valign = center
  position = 0, -150

  font_family = $font_mono
}

# Caps Lock (under password)
label {
  monitor =
  text = cmd[update:250] $scripts/caps_status.sh
  color = $tertiary
  font_size = 14
  font_family = $font_mono
  halign = center
  valign = center
  position = 0, -210
}

# ============== BOTTOM ==============
# Now playing (bottom center)
label {
  monitor =
  text = cmd[update:1000] $scripts/current_song.sh
  color = $secondary
  font_size = 14
  font_family = $font_mono
  halign = center
  valign = bottom
  position = 0, 30
}
