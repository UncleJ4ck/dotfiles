# ── Layer 1: EDID-based defaults (cable-swap-safe baseline) ───────────
# Works no matter which physical port a given monitor is plugged into.
monitor = desc:Iiyama North America PL2470H,    1920x1080@60, 0x0,    1
monitor = desc:Samsung Electric Company C24F390, 1920x1080@60, 1920x0, 1
monitor = desc:Samsung Electric Company S24E450, 1920x1080@60, 3840x0, 1

# ── Layer 2: nwg-displays GUI overrides (Super+Shift+M to edit) ───────
# nwg-displays writes connector-name-based config (e.g. monitor=DP-3,...).
# Last-wins semantics → these override the EDID lines above when present.
# Empty file means "no override" → EDID layer 1 applies.
source = ~/.config/hypr/monitors.conf

# ── Layer 3: lid-manager state (always wins for eDP-1) ────────────────
# Sourced LAST so the lid-manager's eDP-1 enable/disable decision is final.
source = ~/.cache/hypr/lid-preboot.conf

# ── Layer 4: Catchall — auto-enable any unknown monitor ──────────────
monitor = , preferred, auto, 1
