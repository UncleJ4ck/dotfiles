# Monitor layout by EDID description (dynamic — works regardless of connector name)
monitor = desc:Iiyama North America PL2470H, 1920x1080@60, 0x0, 1
monitor = desc:Samsung Electric Company C24F390, 1920x1080@60, 1920x0, 1
monitor = desc:Samsung Electric Company S24E450, 1920x1080@60, 3840x0, 1

# Lid display — default enabled, lid-manager.sh disables when appropriate
# Sourced from preboot config for safe boot (avoids 4-output-on-3-CRTC)
source = ~/.cache/hypr/lid-preboot.conf

# Unknown monitors: auto-enable at preferred resolution
monitor = , preferred, auto, 1
