# Decorations Configuration
# Glass-style transparent design inspired by my-rice-glass

general {
    gaps_in = 4
    gaps_out = 7
    border_size = 3

    col.active_border = $border_active
    col.inactive_border = $border_inactive

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    # Rounded corners - glass style
    rounding = 12
    rounding_power = 2

    # Glass transparency effect
    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    # Dim inactive windows slightly
    dim_inactive = true
    dim_strength = 0.05

    # Shadows — tuned for HD 630 iGPU (range 40→22, render_power 3→2)
    # Slightly tighter falloff, ~40% less GPU work per frame.
    shadow {
        enabled = true
        range = 22
        render_power = 2
        color = rgba(00000066)
        offset = 0 2
    }

    # Blur — frosted glass, tuned for HD 630 iGPU (passes 2→1, size 6→5).
    # 1-pass kawase at size 5 looks ≈identical to 2-pass size 6 but ~60% cheaper.
    # With 3 monitors × multiple windows that adds up to noticeably smoother
    # workspace switches.
    blur {
        enabled = true
        size = 5
        passes = 1
        new_optimizations = true
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        ignore_opacity = true
        xray = false
        popups = true
        popups_ignorealpha = 0.2
    }
}

# Dwindle layout settings
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

# Master layout settings
master {
    new_status = master
    orientation = left
    mfact = 0.5
}
