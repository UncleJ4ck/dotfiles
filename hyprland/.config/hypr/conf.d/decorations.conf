# Glass-style decorations

general {
    gaps_in = 4
    gaps_out = 7
    border_size = 3

    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $border_inactive

    resize_on_border = true
    allow_tearing = false
    layout = dwindle

    snap {
        enabled = true
        window_gap = 10
    }
}

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.05

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000066)
        offset = 0 2
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        ignore_opacity = true
        xray = false
        popups = true
        popups_ignorealpha = 0.2
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
    orientation = left
    mfact = 0.5
}

group {
    col.border_active = $primary $tertiary 45deg
    col.border_inactive = $border_inactive
    col.border_locked_active = $accent

    groupbar {
        enabled = true
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        height = 16
        gradients = true
        rounding = 8
        render_titles = true
        text_color = $on_surface
        col.active = $accent_dim
        col.inactive = $surface_container
    }
}
