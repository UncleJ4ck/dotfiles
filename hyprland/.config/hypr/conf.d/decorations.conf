# Decorations Configuration
# Glass-style transparent design inspired by my-rice-glass

general {
    gaps_in = 4
    gaps_out = 7
    border_size = 3

    # Border colors (fallback - overridden by ~/.config/hypr/matugen/colors.conf)
    # These Nord colors are used if matugen hasn't generated colors yet
    col.active_border = rgba(88c0d0ee)
    col.inactive_border = rgba(3b4252aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    # Rounded corners - glass style
    rounding = 12
    rounding_power = 2

    # Glass transparency effect
    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    # Dim inactive windows slightly
    dim_inactive = true
    dim_strength = 0.05

    # Shadows
    shadow {
        enabled = true
        range = 40
        render_power = 3
        color = rgba(00000066)
        offset = 0 2
    }

    # Blur - Frosted glass effect
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        ignore_opacity = true
        xray = false
        popups = true
        popups_ignorealpha = 0.2
    }
}

# Dwindle layout settings
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

# Master layout settings
master {
    new_status = master
    orientation = left
    mfact = 0.5
}
