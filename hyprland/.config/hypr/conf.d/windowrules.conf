# Window Rules
# Control window behavior, placement, and appearance

# ══════════════════════════════════════════════════════════════
# Global Rules
# ══════════════════════════════════════════════════════════════
windowrule = suppress_event maximize, match:class .*


# ══════════════════════════════════════════════════════════════
# Floating Windows
# ══════════════════════════════════════════════════════════════
# File dialogs
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Open Folder)$
windowrule = float on, match:title ^(Select a File)$
windowrule = float on, match:title ^(Choose wallpaper)$
windowrule = float on, match:title ^(File Operation Progress)$

# System utilities
windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 700 500, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$

windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 600 400, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = center on, match:class ^(nm-connection-editor)$

# File managers (when launched as dialogs)
windowrule = float on, match:class ^(thunar)$, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(org.gnome.Nautilus)$, match:title ^(Properties)$

# Settings/Preferences windows
windowrule = float on, match:title ^(Preferences)$
windowrule = float on, match:title ^(Settings)$

# Calculators
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = float on, match:class ^(qalculate-gtk)$

# EverCal Calendar
windowrule = float on, match:class ^(com.snes.evercal)$
windowrule = size 900 600, match:class ^(com.snes.evercal)$
windowrule = center on, match:class ^(com.snes.evercal)$


# ══════════════════════════════════════════════════════════════
# Picture-in-Picture
# ══════════════════════════════════════════════════════════════
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = move 68% 72%, match:title ^(Picture-in-Picture)$
windowrule = size 30% 30%, match:title ^(Picture-in-Picture)$

windowrule = float on, match:class ^(mpv)$
windowrule = size 640 360, match:class ^(mpv)$


# ══════════════════════════════════════════════════════════════
# Browser Rules
# ══════════════════════════════════════════════════════════════
windowrule = float on, match:class ^(firefox)$, match:title ^(About Mozilla Firefox)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Library)$


# ══════════════════════════════════════════════════════════════
# Development Tools
# ══════════════════════════════════════════════════════════════
windowrule = float on, match:class ^(code)$, match:title ^(Open File)$
windowrule = float on, match:class ^(code)$, match:title ^(Open Folder)$


# ══════════════════════════════════════════════════════════════
# Gaming / Steam
# ══════════════════════════════════════════════════════════════
windowrule = float on, match:class ^(steam)$
windowrule = size 1100 700, match:class ^(steam)$, match:title ^(Steam)$
windowrule = center on, match:class ^(steam)$, match:title ^(Steam)$
windowrule = float on, match:class ^(steam)$, match:title ^(Friends List)$
windowrule = size 400 600, match:class ^(steam)$, match:title ^(Friends List)$


# ══════════════════════════════════════════════════════════════
# Communication Apps
# ══════════════════════════════════════════════════════════════
# Discord image viewer
windowrule = float on, match:class ^(discord)$, match:title ^(.*)( - Discord)$
windowrule = float on, match:class ^(vesktop)$, match:title ^(Discord Popout)$


# ══════════════════════════════════════════════════════════════
# Desktop Portals & System
# ══════════════════════════════════════════════════════════════
# XWayland video bridge (screen sharing fix)
windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur on, match:class ^(xwaylandvideobridge)$
windowrule = no_focus on, match:class ^(xwaylandvideobridge)$


# ══════════════════════════════════════════════════════════════
# Opacity Rules
# ══════════════════════════════════════════════════════════════
windowrule = opacity 0.95 0.90, match:class ^(thunar)$
windowrule = opacity 0.95 0.90, match:class ^(org.gnome.Nautilus)$
windowrule = opacity 0.95 0.85, match:class ^(Code)$
windowrule = opacity 0.95 0.85, match:class ^(code-url-handler)$


# ══════════════════════════════════════════════════════════════
# Rofi / Launchers
# ══════════════════════════════════════════════════════════════
windowrule = float on, match:class ^(rofi)$
windowrule = stay_focused on, match:class ^(rofi)$
windowrule = animation slide, match:class ^(rofi)$


# ══════════════════════════════════════════════════════════════
# Notification / System Tray
# ══════════════════════════════════════════════════════════════
windowrule = float on, match:class ^(swaync)$


# ══════════════════════════════════════════════════════════════
# Pinned Window Rules
# ══════════════════════════════════════════════════════════════
windowrule = border_color rgb(328E6E), match:pin 1
windowrule = border_size 3, match:pin 1


# ══════════════════════════════════════════════════════════════
# Fullscreen Rules
# ══════════════════════════════════════════════════════════════
windowrule = border_color rgb(E2971F), match:fullscreen 1
windowrule = rounding 0, match:fullscreen 1


# ══════════════════════════════════════════════════════════════
# Layer Rules (Blur for UI elements)
# Hyprland 0.53+ syntax: match:namespace required, ignore_zero removed
# ══════════════════════════════════════════════════════════════
layerrule = blur on, ignore_alpha 0.5, match:namespace waybar

layerrule = blur on, ignore_alpha 0.3, animation slide, match:namespace rofi

layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = blur on, ignore_alpha 0.8, match:namespace swaync-notification-window

layerrule = blur on, match:namespace logout_dialog
