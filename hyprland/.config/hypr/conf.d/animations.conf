# Animations Configuration
# Glass-style animations with Material Design 3 motion curves

animations {
    enabled = true

    # Entrances: emphasized deceleration (fast start, gentle landing)
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    # Exits: emphasized acceleration (gentle start, fast departure)
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    # Spatial motion with slight overshoot (glass bounce feel)
    bezier = expressiveSpatial, 0.38, 1.21, 0.22, 1.00
    # Standard deceleration (menus, overlays)
    bezier = menuDecel, 0.1, 1, 0, 1
    # Snappy dismissal (layer/menu close)
    bezier = menuAccel, 0.52, 0.03, 0.72, 0.08
    # Delayed start (frosted glass lingering effect)
    bezier = glassStall, 1, -0.1, 0.7, 0.85
    # Linear (for opacity transitions)
    bezier = linear, 0, 0, 1, 1

    # Slow border color transition (smooth Material You palette shift)
    animation = border, 1, 8, emphasizedDecel

    # Open: pop in from 82% with deceleration (glass appearing)
    animation = windowsIn, 1, 3.5, emphasizedDecel, popin 82%
    # Close: pop out to 88% with acceleration (glass dissolving)
    animation = windowsOut, 1, 2.5, emphasizedAccel, popin 88%
    # Move/resize: smooth spatial motion with subtle overshoot
    animation = windowsMove, 1, 3.5, expressiveSpatial, slide

    animation = fadeIn, 1, 2.5, emphasizedDecel
    animation = fadeOut, 1, 2, emphasizedAccel
    animation = fadeSwitch, 1, 3, emphasizedDecel
    animation = fadeDim, 1, 4, menuDecel

    # Layers pop in slightly (subtle scale for glass UI panels)
    animation = layersIn, 1, 3, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.5, menuAccel, popin 94%
    # Layer fades: fast in, lingering out (frosted glass feel)
    animation = fadeLayersIn, 1, 1.5, menuDecel
    animation = fadeLayersOut, 1, 3, glassStall

    animation = workspaces, 1, 5, menuDecel, slide
    animation = workspacesIn, 1, 5, menuDecel, slide
    animation = workspacesOut, 1, 5, menuDecel, slide

    # Vertical slide: decel in, accel out (asymmetric for fluidity)
    animation = specialWorkspaceIn, 1, 3, emphasizedDecel, slidefadevert -50%
    animation = specialWorkspaceOut, 1, 2, emphasizedAccel, slidefadevert 50%

    animation = zoomFactor, 1, 3, emphasizedDecel
}
