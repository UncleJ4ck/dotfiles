# Keybindings Configuration
# All keyboard shortcuts for Hyprland
# Binds use `bindd` (described) so the Super+I viewer reads in plain language.

$mainMod = SUPER

# Application variables
$terminal = uwsm app -- kitty
$menu = uwsm app -- rofi -show drun
$browser = uwsm app -- firefox
$filemanager = uwsm app -- thunar

# Application Launchers
bindd = $mainMod, RETURN, Open terminal (console / shell / kitty), exec, $terminal
bindd = $mainMod, D, App launcher (run / launch apps / menu), exec, $menu
bindd = $mainMod, F, Open browser (firefox / web / internet), exec, $browser
bindd = $mainMod, E, Open file manager (files / thunar / explorer), exec, $filemanager
bindd = $mainMod, T, Open editor (nvim), exec, uwsm app -- kitty -e nvim

# Window Management
bindd = $mainMod, Q, Close window (quit / kill active), killactive
bindd = $mainMod, M, Exit Hyprland session, exec, uwsm stop
bindd = $mainMod SHIFT, F, Toggle floating (unfloat / tiled / free move), togglefloating
bindd = $mainMod, P, Toggle pseudo-tile, pseudo
bindd = $mainMod, B, Toggle split direction, layoutmsg, togglesplit
bindd = $mainMod CTRL, F, Fullscreen (maximize), fullscreen, 0
bindd = $mainMod, X, Pin window (all workspaces), pin

# Focus Navigation (Arrow Keys)
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d

# Focus Navigation (Vim-like)
bindd = $mainMod, H, Focus left, movefocus, l
bindd = $mainMod, L, Focus right, movefocus, r
bindd = $mainMod, K, Focus up, movefocus, u
bindd = $mainMod, J, Focus down, movefocus, d

# Window Movement
bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d

bindd = $mainMod SHIFT, H, Move window left, movewindow, l
bindd = $mainMod SHIFT, L, Move window right, movewindow, r
bindd = $mainMod SHIFT, K, Move window up, movewindow, u
bindd = $mainMod SHIFT, J, Move window down, movewindow, d

# Window Resize
bindd = $mainMod ALT, left, Shrink window width (smaller / narrower), resizeactive, -50 0
bindd = $mainMod ALT, right, Grow window width (bigger / wider / enlarge), resizeactive, 50 0
bindd = $mainMod ALT, up, Shrink window height (smaller / shorter), resizeactive, 0 -50
bindd = $mainMod ALT, down, Grow window height (bigger / taller), resizeactive, 0 50

bindd = $mainMod ALT, H, Shrink window width (smaller / narrower), resizeactive, -50 0
bindd = $mainMod ALT, L, Grow window width (bigger / wider / enlarge), resizeactive, 50 0
bindd = $mainMod ALT, K, Shrink window height (smaller / shorter), resizeactive, 0 -50
bindd = $mainMod ALT, J, Grow window height (bigger / taller), resizeactive, 0 50

# Mouse resize/move (mousebinds take no description field in this Hyprland build)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Linked Workspaces (split-monitor-workspaces plugin)
# Super+N switches ALL monitors to workspace group N

# Standard number keys (US/QWERTY layout)
bindd = $mainMod, 1, Workspace 1 (all monitors), split-workspace, 1
bindd = $mainMod, 2, Workspace 2 (all monitors), split-workspace, 2
bindd = $mainMod, 3, Workspace 3 (all monitors), split-workspace, 3
bindd = $mainMod, 4, Workspace 4 (all monitors), split-workspace, 4
bindd = $mainMod, 5, Workspace 5 (all monitors), split-workspace, 5
bindd = $mainMod, 6, Workspace 6 (all monitors), split-workspace, 6
bindd = $mainMod, 7, Workspace 7 (all monitors), split-workspace, 7
bindd = $mainMod, 8, Workspace 8 (all monitors), split-workspace, 8
bindd = $mainMod, 9, Workspace 9 (all monitors), split-workspace, 9

# Numpad keys - NumLock ON (KP_1 through KP_9)
bindd = $mainMod, KP_1, Workspace 1 (all monitors), split-workspace, 1
bindd = $mainMod, KP_2, Workspace 2 (all monitors), split-workspace, 2
bindd = $mainMod, KP_3, Workspace 3 (all monitors), split-workspace, 3
bindd = $mainMod, KP_4, Workspace 4 (all monitors), split-workspace, 4
bindd = $mainMod, KP_5, Workspace 5 (all monitors), split-workspace, 5
bindd = $mainMod, KP_6, Workspace 6 (all monitors), split-workspace, 6
bindd = $mainMod, KP_7, Workspace 7 (all monitors), split-workspace, 7
bindd = $mainMod, KP_8, Workspace 8 (all monitors), split-workspace, 8
bindd = $mainMod, KP_9, Workspace 9 (all monitors), split-workspace, 9

# Numpad keys - NumLock OFF (directional keys)
bindd = $mainMod, KP_End, Workspace 1 (all monitors), split-workspace, 1
bindd = $mainMod, KP_Down, Workspace 2 (all monitors), split-workspace, 2
bindd = $mainMod, KP_Next, Workspace 3 (all monitors), split-workspace, 3
bindd = $mainMod, KP_Left, Workspace 4 (all monitors), split-workspace, 4
bindd = $mainMod, KP_Begin, Workspace 5 (all monitors), split-workspace, 5
bindd = $mainMod, KP_Right, Workspace 6 (all monitors), split-workspace, 6
bindd = $mainMod, KP_Home, Workspace 7 (all monitors), split-workspace, 7
bindd = $mainMod, KP_Up, Workspace 8 (all monitors), split-workspace, 8
bindd = $mainMod, KP_Prior, Workspace 9 (all monitors), split-workspace, 9

# French AZERTY number row (keycodes: ampersand=1 / eacute=2 / etc.)
bindd = $mainMod, ampersand, Workspace 1 (all monitors), split-workspace, 1
bindd = $mainMod, eacute, Workspace 2 (all monitors), split-workspace, 2
bindd = $mainMod, quotedbl, Workspace 3 (all monitors), split-workspace, 3
bindd = $mainMod, apostrophe, Workspace 4 (all monitors), split-workspace, 4
bindd = $mainMod, parenleft, Workspace 5 (all monitors), split-workspace, 5
bindd = $mainMod, minus, Workspace 6 (all monitors), split-workspace, 6
bindd = $mainMod, egrave, Workspace 7 (all monitors), split-workspace, 7
bindd = $mainMod, underscore, Workspace 8 (all monitors), split-workspace, 8
bindd = $mainMod, ccedilla, Workspace 9 (all monitors), split-workspace, 9

# Move window to workspace (follows window)
bindd = $mainMod SHIFT, 1, Send window to workspace 1, split-movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Send window to workspace 2, split-movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Send window to workspace 3, split-movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Send window to workspace 4, split-movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Send window to workspace 5, split-movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Send window to workspace 6, split-movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Send window to workspace 7, split-movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Send window to workspace 8, split-movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Send window to workspace 9, split-movetoworkspace, 9

# Numpad: Move window - NumLock ON
bindd = $mainMod SHIFT, KP_1, Send window to workspace 1, split-movetoworkspace, 1
bindd = $mainMod SHIFT, KP_2, Send window to workspace 2, split-movetoworkspace, 2
bindd = $mainMod SHIFT, KP_3, Send window to workspace 3, split-movetoworkspace, 3
bindd = $mainMod SHIFT, KP_4, Send window to workspace 4, split-movetoworkspace, 4
bindd = $mainMod SHIFT, KP_5, Send window to workspace 5, split-movetoworkspace, 5
bindd = $mainMod SHIFT, KP_6, Send window to workspace 6, split-movetoworkspace, 6
bindd = $mainMod SHIFT, KP_7, Send window to workspace 7, split-movetoworkspace, 7
bindd = $mainMod SHIFT, KP_8, Send window to workspace 8, split-movetoworkspace, 8
bindd = $mainMod SHIFT, KP_9, Send window to workspace 9, split-movetoworkspace, 9

# Numpad: Move window - NumLock OFF
bindd = $mainMod SHIFT, KP_End, Send window to workspace 1, split-movetoworkspace, 1
bindd = $mainMod SHIFT, KP_Down, Send window to workspace 2, split-movetoworkspace, 2
bindd = $mainMod SHIFT, KP_Next, Send window to workspace 3, split-movetoworkspace, 3
bindd = $mainMod SHIFT, KP_Left, Send window to workspace 4, split-movetoworkspace, 4
bindd = $mainMod SHIFT, KP_Begin, Send window to workspace 5, split-movetoworkspace, 5
bindd = $mainMod SHIFT, KP_Right, Send window to workspace 6, split-movetoworkspace, 6
bindd = $mainMod SHIFT, KP_Home, Send window to workspace 7, split-movetoworkspace, 7
bindd = $mainMod SHIFT, KP_Up, Send window to workspace 8, split-movetoworkspace, 8
bindd = $mainMod SHIFT, KP_Prior, Send window to workspace 9, split-movetoworkspace, 9

# French AZERTY: Move window
bindd = $mainMod SHIFT, ampersand, Send window to workspace 1, split-movetoworkspace, 1
bindd = $mainMod SHIFT, eacute, Send window to workspace 2, split-movetoworkspace, 2
bindd = $mainMod SHIFT, quotedbl, Send window to workspace 3, split-movetoworkspace, 3
bindd = $mainMod SHIFT, apostrophe, Send window to workspace 4, split-movetoworkspace, 4
bindd = $mainMod SHIFT, parenleft, Send window to workspace 5, split-movetoworkspace, 5
bindd = $mainMod SHIFT, minus, Send window to workspace 6, split-movetoworkspace, 6
bindd = $mainMod SHIFT, egrave, Send window to workspace 7, split-movetoworkspace, 7
bindd = $mainMod SHIFT, underscore, Send window to workspace 8, split-movetoworkspace, 8
bindd = $mainMod SHIFT, ccedilla, Send window to workspace 9, split-movetoworkspace, 9

# Move window silently (don't follow)
bindd = $mainMod CTRL, 1, Send window to workspace 1 (silent), split-movetoworkspacesilent, 1
bindd = $mainMod CTRL, 2, Send window to workspace 2 (silent), split-movetoworkspacesilent, 2
bindd = $mainMod CTRL, 3, Send window to workspace 3 (silent), split-movetoworkspacesilent, 3
bindd = $mainMod CTRL, 4, Send window to workspace 4 (silent), split-movetoworkspacesilent, 4
bindd = $mainMod CTRL, 5, Send window to workspace 5 (silent), split-movetoworkspacesilent, 5
bindd = $mainMod CTRL, 6, Send window to workspace 6 (silent), split-movetoworkspacesilent, 6
bindd = $mainMod CTRL, 7, Send window to workspace 7 (silent), split-movetoworkspacesilent, 7
bindd = $mainMod CTRL, 8, Send window to workspace 8 (silent), split-movetoworkspacesilent, 8
bindd = $mainMod CTRL, 9, Send window to workspace 9 (silent), split-movetoworkspacesilent, 9

# Numpad: Move window silently - NumLock ON
bindd = $mainMod CTRL, KP_1, Send window to workspace 1 (silent), split-movetoworkspacesilent, 1
bindd = $mainMod CTRL, KP_2, Send window to workspace 2 (silent), split-movetoworkspacesilent, 2
bindd = $mainMod CTRL, KP_3, Send window to workspace 3 (silent), split-movetoworkspacesilent, 3
bindd = $mainMod CTRL, KP_4, Send window to workspace 4 (silent), split-movetoworkspacesilent, 4
bindd = $mainMod CTRL, KP_5, Send window to workspace 5 (silent), split-movetoworkspacesilent, 5
bindd = $mainMod CTRL, KP_6, Send window to workspace 6 (silent), split-movetoworkspacesilent, 6
bindd = $mainMod CTRL, KP_7, Send window to workspace 7 (silent), split-movetoworkspacesilent, 7
bindd = $mainMod CTRL, KP_8, Send window to workspace 8 (silent), split-movetoworkspacesilent, 8
bindd = $mainMod CTRL, KP_9, Send window to workspace 9 (silent), split-movetoworkspacesilent, 9

# Numpad: Move window silently - NumLock OFF
bindd = $mainMod CTRL, KP_End, Send window to workspace 1 (silent), split-movetoworkspacesilent, 1
bindd = $mainMod CTRL, KP_Down, Send window to workspace 2 (silent), split-movetoworkspacesilent, 2
bindd = $mainMod CTRL, KP_Next, Send window to workspace 3 (silent), split-movetoworkspacesilent, 3
bindd = $mainMod CTRL, KP_Left, Send window to workspace 4 (silent), split-movetoworkspacesilent, 4
bindd = $mainMod CTRL, KP_Begin, Send window to workspace 5 (silent), split-movetoworkspacesilent, 5
bindd = $mainMod CTRL, KP_Right, Send window to workspace 6 (silent), split-movetoworkspacesilent, 6
bindd = $mainMod CTRL, KP_Home, Send window to workspace 7 (silent), split-movetoworkspacesilent, 7
bindd = $mainMod CTRL, KP_Up, Send window to workspace 8 (silent), split-movetoworkspacesilent, 8
bindd = $mainMod CTRL, KP_Prior, Send window to workspace 9 (silent), split-movetoworkspacesilent, 9

# French AZERTY: Move window silently
bindd = $mainMod CTRL, ampersand, Send window to workspace 1 (silent), split-movetoworkspacesilent, 1
bindd = $mainMod CTRL, eacute, Send window to workspace 2 (silent), split-movetoworkspacesilent, 2
bindd = $mainMod CTRL, quotedbl, Send window to workspace 3 (silent), split-movetoworkspacesilent, 3
bindd = $mainMod CTRL, apostrophe, Send window to workspace 4 (silent), split-movetoworkspacesilent, 4
bindd = $mainMod CTRL, parenleft, Send window to workspace 5 (silent), split-movetoworkspacesilent, 5
bindd = $mainMod CTRL, minus, Send window to workspace 6 (silent), split-movetoworkspacesilent, 6
bindd = $mainMod CTRL, egrave, Send window to workspace 7 (silent), split-movetoworkspacesilent, 7
bindd = $mainMod CTRL, underscore, Send window to workspace 8 (silent), split-movetoworkspacesilent, 8
bindd = $mainMod CTRL, ccedilla, Send window to workspace 9 (silent), split-movetoworkspacesilent, 9

# Workspace scrolling (all monitors stay in sync via link_monitors)
bindd = $mainMod, mouse_down, Next workspace (scroll), split-cycleworkspaces, +1
bindd = $mainMod, mouse_up, Previous workspace (scroll), split-cycleworkspaces, -1
bindd = $mainMod, TAB, Cycle to previous workspace, split-cycleworkspaces, -1

# Special Workspace (Scratchpad)
bindd = $mainMod, grave, Toggle scratchpad (special workspace / magic), togglespecialworkspace, magic
bindd = $mainMod SHIFT, grave, Send window to scratchpad, movetoworkspace, special:magic
bindd = $mainMod SHIFT, N, Notejot scratchpad, exec, ~/.config/hypr/scripts/notejot-scratchpad.sh

# Groups/Tabbed Windows
bindd = $mainMod, G, Toggle window group, togglegroup
bindd = $mainMod, bracketleft, Previous tab in group, changegroupactive, b
bindd = $mainMod, bracketright, Next tab in group, changegroupactive, f
bindd = $mainMod SHIFT, G, Move window out of group, moveoutofgroup

# Lock & Power
bindd = $mainMod CTRL, L, Lock screen (hyprlock), exec, pidof hyprlock || uwsm app -- hyprlock
bindd = $mainMod SHIFT, E, Power menu (logout / shutdown / reboot / suspend / exit), exec, ~/.config/rofi/scripts/power/power.sh

# Keybind Viewer
bindd = $mainMod, I, Show keybinds, exec, ~/.config/rofi/scripts/keybinds/keybinds.sh

# Screenshots
bindd = $mainMod, S, Screenshot region (edit), exec, grim -g "$(slurp)" - | satty --filename -
bindd = , Print, Screenshot full screen (edit), exec, grim - | satty --filename -
bindd = $mainMod SHIFT, S, Screenshot region to file, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bindd = $mainMod, Print, Screenshot full screen to file, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bindd = $mainMod CTRL, R, Record screen (screencast / video capture), exec, ~/.config/hypr/scripts/media/screen-record.sh screen
bindd = $mainMod CTRL SHIFT, R, Record region (screencast area / video capture), exec, ~/.config/hypr/scripts/media/screen-record.sh region

# Media & Hardware Keys
# Volume
binddel = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binddel = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddl = , XF86AudioMute, Mute output, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddl = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
binddel = , XF86MonBrightnessUp, Brightness up (screen brighter), exec, brightnessctl set 5%+
binddel = , XF86MonBrightnessDown, Brightness down (dim screen / darker), exec, brightnessctl set 5%-

# Media playback
binddl = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
binddl = , XF86AudioPause, Play/pause, exec, playerctl play-pause
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous
binddl = , XF86AudioStop, Stop playback, exec, playerctl stop

# Utilities
# Clipboard history
bindd = $mainMod, V, Clipboard history (paste / copy / clip), exec, ~/.config/rofi/scripts/clipboard/clipboard.sh

# Wallpaper
bindd = $mainMod, W, Random wallpaper + theme (background / wall / recolour), exec, ~/.config/hypr/scripts/hypr-themectl/hypr-themectl.sh apply --random

# Notification center
bindd = $mainMod, N, Toggle notification center (notifications / dnd), exec, swaync-client -t

# Color picker
bindd = $mainMod SHIFT, C, Color picker (eyedropper / hex / pick colour), exec, hyprpicker -a

# Lid Switch (instant response / no polling)
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/power/lid-manager.sh
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/power/lid-manager.sh

# Zoom/Accessibility
# Note: Using numpad keys to avoid conflict with AZERTY layout
# (AZERTY uses 'minus' keysym for the 6 key)
bindd = $mainMod, KP_Add, Zoom in (magnify / enlarge screen), exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 + 0.5}')
bindd = $mainMod, KP_Subtract, Zoom out (magnify less / shrink screen), exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | awk '{z=$2-0.5; if(z<1)z=1; print z}')
bindd = $mainMod, Backspace, Reset zoom (100 percent / normal), exec, hyprctl keyword cursor:zoom_factor 1
# Alternative: scroll wheel zoom
bindd = $mainMod CTRL, mouse_down, Zoom in (scroll), exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 + 0.25}')
bindd = $mainMod CTRL, mouse_up, Zoom out (scroll), exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | awk '{z=$2-0.25; if(z<1)z=1; print z}')
bindd = $mainMod SHIFT, A, Audio output picker (sound / sink / speaker / headphones / volume device), exec, ~/.config/rofi/scripts/audio-sink-picker.sh

# Monitor arrangement GUI (nwg-displays)
bindd = $mainMod SHIFT, M, Monitor arrangement GUI (displays / screens / layout), exec, uwsm app -- nwg-displays
