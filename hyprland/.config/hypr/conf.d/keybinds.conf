# Keybindings Configuration
# All keyboard shortcuts for Hyprland

$mainMod = SUPER

# Application variables
$terminal = uwsm app -- kitty
$menu = uwsm app -- rofi -show drun
$browser = uwsm app -- firefox
$filemanager = uwsm app -- thunar


# ══════════════════════════════════════════════════════════════
# Application Launchers
# ══════════════════════════════════════════════════════════════
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, exec, $browser
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, T, exec, uwsm app -- kitty -e nvim


# ══════════════════════════════════════════════════════════════
# Window Management
# ══════════════════════════════════════════════════════════════
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, uwsm stop
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, B, togglesplit
bind = $mainMod CTRL, F, fullscreen, 0
bind = $mainMod, X, pin


# ══════════════════════════════════════════════════════════════
# Focus Navigation (Arrow Keys)
# ══════════════════════════════════════════════════════════════
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Focus Navigation (Vim-like)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d


# ══════════════════════════════════════════════════════════════
# Window Movement
# ══════════════════════════════════════════════════════════════
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d


# ══════════════════════════════════════════════════════════════
# Window Resize
# ══════════════════════════════════════════════════════════════
bind = $mainMod ALT, left, resizeactive, -50 0
bind = $mainMod ALT, right, resizeactive, 50 0
bind = $mainMod ALT, up, resizeactive, 0 -50
bind = $mainMod ALT, down, resizeactive, 0 50

bind = $mainMod ALT, H, resizeactive, -50 0
bind = $mainMod ALT, L, resizeactive, 50 0
bind = $mainMod ALT, K, resizeactive, 0 -50
bind = $mainMod ALT, J, resizeactive, 0 50

# Mouse resize/move
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ══════════════════════════════════════════════════════════════
# Workspace Groups (synchronized across all monitors)
# Super+N switches ALL monitors to workspace group N
# ══════════════════════════════════════════════════════════════
$wsScript = ~/.config/hypr/scripts/workspace-groups.sh

# Standard number keys (US/QWERTY layout)
bind = $mainMod, 1, exec, $wsScript switch 1
bind = $mainMod, 2, exec, $wsScript switch 2
bind = $mainMod, 3, exec, $wsScript switch 3
bind = $mainMod, 4, exec, $wsScript switch 4
bind = $mainMod, 5, exec, $wsScript switch 5
bind = $mainMod, 6, exec, $wsScript switch 6
bind = $mainMod, 7, exec, $wsScript switch 7
bind = $mainMod, 8, exec, $wsScript switch 8
bind = $mainMod, 9, exec, $wsScript switch 9

# Numpad keys - NumLock ON (KP_1 through KP_9)
bind = $mainMod, KP_1, exec, $wsScript switch 1
bind = $mainMod, KP_2, exec, $wsScript switch 2
bind = $mainMod, KP_3, exec, $wsScript switch 3
bind = $mainMod, KP_4, exec, $wsScript switch 4
bind = $mainMod, KP_5, exec, $wsScript switch 5
bind = $mainMod, KP_6, exec, $wsScript switch 6
bind = $mainMod, KP_7, exec, $wsScript switch 7
bind = $mainMod, KP_8, exec, $wsScript switch 8
bind = $mainMod, KP_9, exec, $wsScript switch 9

# Numpad keys - NumLock OFF (directional keys)
bind = $mainMod, KP_End, exec, $wsScript switch 1
bind = $mainMod, KP_Down, exec, $wsScript switch 2
bind = $mainMod, KP_Next, exec, $wsScript switch 3
bind = $mainMod, KP_Left, exec, $wsScript switch 4
bind = $mainMod, KP_Begin, exec, $wsScript switch 5
bind = $mainMod, KP_Right, exec, $wsScript switch 6
bind = $mainMod, KP_Home, exec, $wsScript switch 7
bind = $mainMod, KP_Up, exec, $wsScript switch 8
bind = $mainMod, KP_Prior, exec, $wsScript switch 9

# French AZERTY number row (keycodes: ampersand=1, eacute=2, etc.)
bind = $mainMod, ampersand, exec, $wsScript switch 1
bind = $mainMod, eacute, exec, $wsScript switch 2
bind = $mainMod, quotedbl, exec, $wsScript switch 3
bind = $mainMod, apostrophe, exec, $wsScript switch 4
bind = $mainMod, parenleft, exec, $wsScript switch 5
bind = $mainMod, minus, exec, $wsScript switch 6
bind = $mainMod, egrave, exec, $wsScript switch 7
bind = $mainMod, underscore, exec, $wsScript switch 8
bind = $mainMod, ccedilla, exec, $wsScript switch 9

# Move window to workspace group (follows window)
bind = $mainMod SHIFT, 1, exec, $wsScript movetoworkspace 1
bind = $mainMod SHIFT, 2, exec, $wsScript movetoworkspace 2
bind = $mainMod SHIFT, 3, exec, $wsScript movetoworkspace 3
bind = $mainMod SHIFT, 4, exec, $wsScript movetoworkspace 4
bind = $mainMod SHIFT, 5, exec, $wsScript movetoworkspace 5
bind = $mainMod SHIFT, 6, exec, $wsScript movetoworkspace 6
bind = $mainMod SHIFT, 7, exec, $wsScript movetoworkspace 7
bind = $mainMod SHIFT, 8, exec, $wsScript movetoworkspace 8
bind = $mainMod SHIFT, 9, exec, $wsScript movetoworkspace 9

# Numpad: Move window to workspace group - NumLock ON
bind = $mainMod SHIFT, KP_1, exec, $wsScript movetoworkspace 1
bind = $mainMod SHIFT, KP_2, exec, $wsScript movetoworkspace 2
bind = $mainMod SHIFT, KP_3, exec, $wsScript movetoworkspace 3
bind = $mainMod SHIFT, KP_4, exec, $wsScript movetoworkspace 4
bind = $mainMod SHIFT, KP_5, exec, $wsScript movetoworkspace 5
bind = $mainMod SHIFT, KP_6, exec, $wsScript movetoworkspace 6
bind = $mainMod SHIFT, KP_7, exec, $wsScript movetoworkspace 7
bind = $mainMod SHIFT, KP_8, exec, $wsScript movetoworkspace 8
bind = $mainMod SHIFT, KP_9, exec, $wsScript movetoworkspace 9

# Numpad: Move window to workspace group - NumLock OFF
bind = $mainMod SHIFT, KP_End, exec, $wsScript movetoworkspace 1
bind = $mainMod SHIFT, KP_Down, exec, $wsScript movetoworkspace 2
bind = $mainMod SHIFT, KP_Next, exec, $wsScript movetoworkspace 3
bind = $mainMod SHIFT, KP_Left, exec, $wsScript movetoworkspace 4
bind = $mainMod SHIFT, KP_Begin, exec, $wsScript movetoworkspace 5
bind = $mainMod SHIFT, KP_Right, exec, $wsScript movetoworkspace 6
bind = $mainMod SHIFT, KP_Home, exec, $wsScript movetoworkspace 7
bind = $mainMod SHIFT, KP_Up, exec, $wsScript movetoworkspace 8
bind = $mainMod SHIFT, KP_Prior, exec, $wsScript movetoworkspace 9

# French AZERTY: Move window to workspace group
bind = $mainMod SHIFT, ampersand, exec, $wsScript movetoworkspace 1
bind = $mainMod SHIFT, eacute, exec, $wsScript movetoworkspace 2
bind = $mainMod SHIFT, quotedbl, exec, $wsScript movetoworkspace 3
bind = $mainMod SHIFT, apostrophe, exec, $wsScript movetoworkspace 4
bind = $mainMod SHIFT, parenleft, exec, $wsScript movetoworkspace 5
bind = $mainMod SHIFT, minus, exec, $wsScript movetoworkspace 6
bind = $mainMod SHIFT, egrave, exec, $wsScript movetoworkspace 7
bind = $mainMod SHIFT, underscore, exec, $wsScript movetoworkspace 8
bind = $mainMod SHIFT, ccedilla, exec, $wsScript movetoworkspace 9

# Move window silently (don't follow)
bind = $mainMod CTRL, 1, exec, $wsScript movetoworkspacesilent 1
bind = $mainMod CTRL, 2, exec, $wsScript movetoworkspacesilent 2
bind = $mainMod CTRL, 3, exec, $wsScript movetoworkspacesilent 3
bind = $mainMod CTRL, 4, exec, $wsScript movetoworkspacesilent 4
bind = $mainMod CTRL, 5, exec, $wsScript movetoworkspacesilent 5
bind = $mainMod CTRL, 6, exec, $wsScript movetoworkspacesilent 6
bind = $mainMod CTRL, 7, exec, $wsScript movetoworkspacesilent 7
bind = $mainMod CTRL, 8, exec, $wsScript movetoworkspacesilent 8
bind = $mainMod CTRL, 9, exec, $wsScript movetoworkspacesilent 9

# Numpad: Move window silently - NumLock ON
bind = $mainMod CTRL, KP_1, exec, $wsScript movetoworkspacesilent 1
bind = $mainMod CTRL, KP_2, exec, $wsScript movetoworkspacesilent 2
bind = $mainMod CTRL, KP_3, exec, $wsScript movetoworkspacesilent 3
bind = $mainMod CTRL, KP_4, exec, $wsScript movetoworkspacesilent 4
bind = $mainMod CTRL, KP_5, exec, $wsScript movetoworkspacesilent 5
bind = $mainMod CTRL, KP_6, exec, $wsScript movetoworkspacesilent 6
bind = $mainMod CTRL, KP_7, exec, $wsScript movetoworkspacesilent 7
bind = $mainMod CTRL, KP_8, exec, $wsScript movetoworkspacesilent 8
bind = $mainMod CTRL, KP_9, exec, $wsScript movetoworkspacesilent 9

# Numpad: Move window silently - NumLock OFF
bind = $mainMod CTRL, KP_End, exec, $wsScript movetoworkspacesilent 1
bind = $mainMod CTRL, KP_Down, exec, $wsScript movetoworkspacesilent 2
bind = $mainMod CTRL, KP_Next, exec, $wsScript movetoworkspacesilent 3
bind = $mainMod CTRL, KP_Left, exec, $wsScript movetoworkspacesilent 4
bind = $mainMod CTRL, KP_Begin, exec, $wsScript movetoworkspacesilent 5
bind = $mainMod CTRL, KP_Right, exec, $wsScript movetoworkspacesilent 6
bind = $mainMod CTRL, KP_Home, exec, $wsScript movetoworkspacesilent 7
bind = $mainMod CTRL, KP_Up, exec, $wsScript movetoworkspacesilent 8
bind = $mainMod CTRL, KP_Prior, exec, $wsScript movetoworkspacesilent 9

# French AZERTY: Move window silently
bind = $mainMod CTRL, ampersand, exec, $wsScript movetoworkspacesilent 1
bind = $mainMod CTRL, eacute, exec, $wsScript movetoworkspacesilent 2
bind = $mainMod CTRL, quotedbl, exec, $wsScript movetoworkspacesilent 3
bind = $mainMod CTRL, apostrophe, exec, $wsScript movetoworkspacesilent 4
bind = $mainMod CTRL, parenleft, exec, $wsScript movetoworkspacesilent 5
bind = $mainMod CTRL, minus, exec, $wsScript movetoworkspacesilent 6
bind = $mainMod CTRL, egrave, exec, $wsScript movetoworkspacesilent 7
bind = $mainMod CTRL, underscore, exec, $wsScript movetoworkspacesilent 8
bind = $mainMod CTRL, ccedilla, exec, $wsScript movetoworkspacesilent 9

# Workspace group scrolling (uses script to keep all monitors in sync)
bind = $mainMod, mouse_down, exec, $wsScript next
bind = $mainMod, mouse_up, exec, $wsScript prev
bind = $mainMod, TAB, exec, $wsScript prev


# ══════════════════════════════════════════════════════════════
# Special Workspace (Scratchpad)
# ══════════════════════════════════════════════════════════════
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic


# ══════════════════════════════════════════════════════════════
# Groups/Tabbed Windows
# ══════════════════════════════════════════════════════════════
bind = $mainMod, G, togglegroup
bind = $mainMod, bracketleft, changegroupactive, b
bind = $mainMod, bracketright, changegroupactive, f
bind = $mainMod SHIFT, G, moveoutofgroup


# ══════════════════════════════════════════════════════════════
# Lock & Power
# ══════════════════════════════════════════════════════════════
bind = $mainMod CTRL, L, exec, pidof hyprlock || uwsm app -- hyprlock


# ══════════════════════════════════════════════════════════════
# Screenshots
# ══════════════════════════════════════════════════════════════
bind = $mainMod, S, exec, grim -g "$(slurp)" - | satty --filename -
bind = , Print, exec, grim - | satty --filename -
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod, Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png


# ══════════════════════════════════════════════════════════════
# Media & Hardware Keys
# ══════════════════════════════════════════════════════════════
# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media playback
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop


# ══════════════════════════════════════════════════════════════
# Utilities
# ══════════════════════════════════════════════════════════════
# Clipboard history
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Wallpaper
bind = $mainMod, W, exec, ~/.config/hypr/scripts/hypr-themectl/hypr-themectl.sh apply --random

# Notification center
bind = $mainMod, N, exec, swaync-client -t

# Color picker
bind = $mainMod SHIFT, C, exec, hyprpicker -a


# ══════════════════════════════════════════════════════════════
# Zoom/Accessibility
# Note: Using numpad keys to avoid conflict with AZERTY layout
# (AZERTY uses 'minus' keysym for the 6 key)
# ══════════════════════════════════════════════════════════════
bind = $mainMod, KP_Add, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 + 0.5}')
bind = $mainMod, KP_Subtract, exec, hyprctl keyword cursor:zoom_factor $(echo "$(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2}') - 0.5" | bc)
bind = $mainMod, Backspace, exec, hyprctl keyword cursor:zoom_factor 1
# Alternative: scroll wheel zoom
bind = $mainMod CTRL, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2 + 0.25}')
bind = $mainMod CTRL, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(echo "$(hyprctl getoption cursor:zoom_factor | grep float | awk '{print $2}') - 0.25" | bc)
