# vim:ft=kitty
#===============================================================================
# KEYBINDINGS
#===============================================================================

kitty_mod                    alt

map ctrl+v                   paste_from_clipboard
map ctrl+c                   copy_or_interrupt

map kitty_mod+n              new_os_window_with_cwd

map kitty_mod+p              set_background_opacity -0.1
map kitty_mod+o              set_background_opacity +0.1
map kitty_mod+shift+o        set_background_opacity default

map kitty_mod+shift+page_up   change_font_size all +2.0
map kitty_mod+shift+page_down change_font_size all -2.0
map kitty_mod+shift+backspace change_font_size all 0

# Search (only alt+f, no ctrl+f)
map kitty_mod+f              kitten search

# Jump between prompts (shell integration marks)
map kitty_mod+]              scroll_to_prompt 1
map kitty_mod+[              scroll_to_prompt -1

map kitty_mod+r              load_config_file

# Open current dir in Thunar (normal window is Hyprland-side; ensure no float rule)
map kitty_mod+e launch --type=background --cwd=current sh -c \
  'if command -v uwsm >/dev/null 2>&1; then uwsm app -- thunar "$PWD"; else thunar "$PWD"; fi'

map kitty_mod+j launch --type=background --cwd=current sh -c \
  'if command -v uwsm >/dev/null 2>&1; then uwsm app -- code "$PWD"; else code "$PWD"; fi'
