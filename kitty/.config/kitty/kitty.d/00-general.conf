# vim:ft=kitty
#===============================================================================
# GENERAL SETTINGS
#===============================================================================

linux_display_server         auto
sync_to_monitor              yes
hide_window_decorations      yes
detect_urls yes


confirm_os_window_close      0
remember_window_size         no
initial_window_width         950
initial_window_height        500
window_padding_width         10

background_opacity           1.0
dynamic_background_opacity   yes

# zsh
shell                        zsh

# Avoid kitty changing cursor shape via shell integration
shell_integration            no-cursor

# Editor used by open-actions (text/*)
editor                       nvim
visual_editor                nvim

scrollback_lines             2000
wheel_scroll_min_lines       1

# Scrollbar
scrollbar                    hovered
scrollbar_interactive        yes
scrollbar_track_hover_opacity 0.1
scrollbar_gap                0.5
scrollbar_radius             0.5

enable_audio_bell            no

# Remote control (for live theme reload via `kitty @ set-colors`).
# socket-only = secure, only accepts commands via the listening socket below.
# {kitty_pid} gives each instance a unique abstract socket so lid-manager /
# hypr-themectl can target individual instances without collisions.
allow_remote_control         socket-only
listen_on                    unix:@kitty-{kitty_pid}
