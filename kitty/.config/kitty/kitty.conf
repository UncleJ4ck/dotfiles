# ═══════════════════════════════════════════════════════════════════════════
#  kitty configuration  —  full reference: kitty +kitten themes / kitty --help
#  ──────────────────────────────────────────────────────────────────────────
#  Colors live in colors.conf (generated by matugen — don't edit by hand).
#  Click-open rules live in open-actions.conf (kitty reads that separately).
# ═══════════════════════════════════════════════════════════════════════════

include colors.conf

# ═══════════════════════════════════════════════════════════════════════════
#  SESSION
# ═══════════════════════════════════════════════════════════════════════════
shell                        zsh
editor                       nvim
visual_editor                nvim
shell_integration            no-cursor

# ═══════════════════════════════════════════════════════════════════════════
#  WINDOW
# ═══════════════════════════════════════════════════════════════════════════
linux_display_server         auto
sync_to_monitor              yes
hide_window_decorations      yes
confirm_os_window_close      0
remember_window_size         no
initial_window_width         950
initial_window_height        500
window_padding_width         10
placement_strategy           center
enabled_layouts              splits,stack

# Splits: tile windows inside ONE kitty instance (no extra OS windows)
inactive_text_alpha          0.85

# ═══════════════════════════════════════════════════════════════════════════
#  TRANSPARENCY & BACKGROUND
# ═══════════════════════════════════════════════════════════════════════════
background_opacity           1.0
dynamic_background_opacity   yes
background_blur              0

# ═══════════════════════════════════════════════════════════════════════════
#  FONTS
# ═══════════════════════════════════════════════════════════════════════════
font_family                  JetBrainsMono Nerd Font
font_size                    12
bold_font                    auto
italic_font                  auto
bold_italic_font             auto
disable_ligatures            never
adjust_line_height           0
adjust_column_width          0

# ═══════════════════════════════════════════════════════════════════════════
#  CURSOR
# ═══════════════════════════════════════════════════════════════════════════
cursor_shape                 beam
cursor_beam_thickness        2
cursor_shape_unfocused       unchanged
cursor_blink_interval        0.5 ease-in-out
cursor_stop_blinking_after   1
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 6
mouse_hide_wait              -3.0

# ═══════════════════════════════════════════════════════════════════════════
#  SCROLLBACK
# ═══════════════════════════════════════════════════════════════════════════
scrollback_lines             10000
wheel_scroll_min_lines       1
scrollbar                    hovered
scrollbar_interactive        yes
scrollbar_track_hover_opacity 0.1
scrollbar_gap                0.5
scrollbar_radius             0.5

# Open current scrollback in pager (less / nvim) — Alt+Shift+g
scrollback_pager             less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ═══════════════════════════════════════════════════════════════════════════
#  URL DETECTION & HINTS
# ═══════════════════════════════════════════════════════════════════════════
detect_urls                  yes
url_style                    curly
open_url_with                default
underline_hyperlinks         hover
copy_on_select                yes
paste_actions                quote-urls-at-prompt,confirm

# ═══════════════════════════════════════════════════════════════════════════
#  BELL
# ═══════════════════════════════════════════════════════════════════════════
enable_audio_bell            no
visual_bell_duration         0
bell_on_tab                  "🔔 "

# ═══════════════════════════════════════════════════════════════════════════
#  TAB BAR
# ═══════════════════════════════════════════════════════════════════════════
tab_bar_edge                 top
tab_bar_style                powerline
tab_powerline_style          slanted
tab_bar_align                left
tab_bar_min_tabs             2
tab_title_template           "{fmt.fg._cccccc}{index}{fmt.fg.tab}  {title[:30]}{'…' if title.rstrip() != title[:30].rstrip() else ''}"

# ═══════════════════════════════════════════════════════════════════════════
#  REMOTE CONTROL (lets scripts reload colors live)
# ═══════════════════════════════════════════════════════════════════════════
allow_remote_control         socket-only
listen_on                    unix:@kitty-{kitty_pid}

# ═══════════════════════════════════════════════════════════════════════════
#  KEYBINDS   (kitty_mod = Alt)
# ═══════════════════════════════════════════════════════════════════════════
kitty_mod                    alt

# ── Clipboard ────────────────────────────────────────────────────────────
map ctrl+c                   copy_or_interrupt
map ctrl+v                   paste_from_clipboard
map ctrl+shift+c             copy_to_clipboard
map ctrl+shift+v             paste_from_clipboard

# ── Scroll ───────────────────────────────────────────────────────────────
map kitty_mod+shift+up       scroll_line_up
map kitty_mod+shift+down     scroll_line_down
map kitty_mod+shift+page_up  scroll_page_up
map kitty_mod+shift+page_down scroll_page_down
map kitty_mod+shift+home     scroll_home
map kitty_mod+shift+end      scroll_end

# ── Scrollback actions ───────────────────────────────────────────────────
map kitty_mod+shift+g        show_scrollback               # open scrollback in $PAGER
map kitty_mod+shift+h        show_last_command_output      # open last command output in pager
map kitty_mod+shift+delete   clear_terminal reset active   # full reset + clear scrollback

# ── Font size ────────────────────────────────────────────────────────────
map kitty_mod+shift+page_up   change_font_size all +2.0
map kitty_mod+shift+page_down change_font_size all -2.0
map kitty_mod+shift+backspace change_font_size all 0

# ── Opacity (live) ───────────────────────────────────────────────────────
map kitty_mod+p              set_background_opacity -0.05
map kitty_mod+o              set_background_opacity +0.05
map kitty_mod+shift+o        set_background_opacity default

# ── OS window / tab ──────────────────────────────────────────────────────
map kitty_mod+n              new_os_window_with_cwd
map kitty_mod+shift+t        new_tab_with_cwd
map kitty_mod+shift+q        close_tab
map kitty_mod+shift+right    next_tab
map kitty_mod+shift+left     previous_tab
map kitty_mod+shift+.        move_tab_forward
map kitty_mod+shift+,        move_tab_backward
map kitty_mod+shift+r        set_tab_title

# ── Splits (inside ONE kitty window) ─────────────────────────────────────
map kitty_mod+enter          new_window_with_cwd
map kitty_mod+\              launch --location=vsplit --cwd=current
map kitty_mod+-              launch --location=hsplit --cwd=current
map kitty_mod+w              close_window
map kitty_mod+h              neighboring_window left
map kitty_mod+j              neighboring_window down
map kitty_mod+k              neighboring_window up
map kitty_mod+l              neighboring_window right
map kitty_mod+shift+h        move_window left
map kitty_mod+shift+j        move_window down
map kitty_mod+shift+k        move_window up
map kitty_mod+shift+l        move_window right
map kitty_mod+shift+=        resize_window wider 2
map kitty_mod+shift+-        resize_window narrower 2
map kitty_mod+shift+z        layout_action rotate

# ── Hyperlink hints (press, type label, auto-open) ───────────────────────
# Alt+Shift+u — pick URL → open in default browser
map kitty_mod+shift+u        kitten hints --type url --program default
# Alt+Shift+p — pick file path → drop on command line
map kitty_mod+shift+p>f      kitten hints --type path --program -
# Alt+Shift+p>l — pick line from scrollback → drop
map kitty_mod+shift+p>l      kitten hints --type line --program -
# Alt+Shift+p>w — pick word → drop
map kitty_mod+shift+p>w      kitten hints --type word --program -
# Alt+Shift+p>h — pick hash → drop (git commits etc.)
map kitty_mod+shift+p>h      kitten hints --type hash --program -

# ── Unicode picker ───────────────────────────────────────────────────────
map ctrl+shift+u             kitten unicode_input

# ── Searching the scrollback ─────────────────────────────────────────────
map kitty_mod+shift+f        launch --location=hsplit --type=overlay sh -c 'grep -n "" > /tmp/kitty-search; cat /tmp/kitty-search'
# (simpler: use the built-in pager search by hitting Alt+Shift+g then `/`)

# ── Reload config on the fly ────────────────────────────────────────────
map kitty_mod+shift+F5       load_config_file

# ═══════════════════════════════════════════════════════════════════════════
#  MOUSE
# ═══════════════════════════════════════════════════════════════════════════
# Triple-click selects path (not just word) — great for file paths in output
mouse_map left triple press ungrabbed mouse_select_command_output
# Middle-click paste from PRIMARY selection (Linux standard)
mouse_map middle press ungrabbed paste_from_selection
