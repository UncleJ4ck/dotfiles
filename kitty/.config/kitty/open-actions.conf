#===============================================================================
# OPEN ACTIONS (Kitty reads this file separately)
#===============================================================================

# Directories -> Thunar
protocol file
mime inode/directory
action launch --type=background -- sh -c 'if command -v uwsm >/dev/null 2>&1; then uwsm app -- thunar -- "$1"; else thunar -- "$1"; fi' sh "$FILE_PATH"

# Text -> editor overlay
protocol file
mime text/*
action launch --type=overlay -- nvim -- "$FILE_PATH"

# Images -> preview
protocol file
mime image/*
action launch --type=overlay -- kitten icat --hold -- "$FILE_PATH"

# SSH URLs -> new OS window
protocol ssh
action launch --type=os-window -- ssh -- "$URL"

# Shell scripts -> confirm + run via shebang helper
protocol file
ext sh,bash,zsh,fish
action launch --type=os-window --cwd -- kitten __shebang__ confirm-always -C "$FILE_PATH"

# Executables -> confirm + run
protocol file
mime inode/executable,application/x-executable,application/vnd.microsoft.portable-executable
action launch --type=os-window --cwd -- kitten __confirm_and_run_exe__ "$FILE_PATH"
