# btrbk: btrfs snapshot + send/receive backup.
#
# Phase 1 (local): hourly + daily snapshots of @ and @home, kept under
# /.snapshots/. Protects against rm -rf, corruption, accidental edits.
# Does NOT protect against disk failure (it's the same drive).
#
# Phase 2 (offsite): uncomment the target_url block below and point it at
# a USB drive (mount it as /mnt/backup with a btrfs filesystem and a
# .snapshots dir) or a remote ssh target. Re-run `btrbk run` and the
# incremental sends will catch the offsite up.
#
# Test before relying:
#   btrbk run --dry-run
#   btrbk run

backend           btrfs-progs-sudo
timestamp_format  long-iso
ssh_user          backup
transaction_log   /var/log/btrbk.log

# Snapshot retention on the local drive.
snapshot_preserve_min   2h
snapshot_preserve       24h 14d 8w
target_preserve_min     no
target_preserve         48h 30d 26w 6m

volume /
  subvolume /
    snapshot_dir .snapshots
    snapshot_create   onchange

volume /home
  subvolume /
    snapshot_dir .snapshots
    snapshot_create   always

# === Offsite target. Uncomment ONE and configure. ===
#
# Option A: external USB drive mounted at /mnt/backup with btrfs.
#   target send-receive /mnt/backup/snapshots
#
# Option B: remote ssh target (requires `backup` user on the remote with
# btrfs-progs and a writable subvolume).
#   target send-receive ssh://backup-host/var/backup/snapshots
#   ssh_identity /etc/btrbk/ssh/id_ed25519
